name: Cloudflare candidate check

on:
  pull_request:
  workflow_dispatch:
    inputs:
      main_sha:
        description: main commit SHA this candidate is bound to
        required: true
        type: string
      image_digest:
        description: sha256 digest of the pool image candidate
        required: true
        type: string
      build_source_sha:
        description: git SHA that built the image digest
        required: true
        type: string
      run_id:
        description: Actions run id that built the image
        required: true
        type: string

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: backend/go.mod
          check-latest: false
      - name: Local skeleton tests
        run: |
          node --test cloudflare/src/runtime.test.js
          node cloudflare/candidate-check.mjs --self-test
          cd backend && go test -count=1 -timeout 180s -run 'Cloudflare|EnsureBootstrapSecrets' ./internal/config/ ./internal/setup/ ./internal/repository/
      - name: Bind main SHA and digest
        if: github.event_name == 'workflow_dispatch'
        run: |
          git fetch origin main
          node cloudflare/candidate-check.mjs --bind \
            --main-sha "${{ inputs.main_sha }}" \
            --digest "${{ inputs.image_digest }}" \
            --origin-main "$(git rev-parse origin/main)" \
            --build-source-sha "${{ inputs.build_source_sha }}" \
            --head "$(git rev-parse HEAD)" \
            --run-id "${{ inputs.run_id }}"
