name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check deployment scripts
        run: |
          set -euo pipefail
          # apple-container.sh calls BSD stat and macOS plutil. Provide those two
          # commands on Ubuntu so the job does not wait for a macOS runner.
          shim="${RUNNER_TEMP:-/tmp}/macos-shims"
          mkdir -p "$shim"
          cat > "$shim/stat" << 'EOF'
          #!/bin/sh
          if [ "${1-}" = "-f" ]; then
            format="${2-}"
            shift 2
            case "$format" in
              %Lp) exec /usr/bin/stat -c '%a' "$@" ;;
              %u) exec /usr/bin/stat -c '%u' "$@" ;;
            esac
            echo "unsupported stat format" >&2
            exit 1
          fi
          exec /usr/bin/stat "$@"
          EOF
          cat > "$shim/plutil" << 'EOF'
          #!/usr/bin/env python3
          import json
          import sys

          args = sys.argv[1:]
          if args[:1] != ["-extract"] or args[3:5] != ["-o", "-"] or len(args) != 6:
              sys.stderr.write("unsupported plutil invocation\n")
              raise SystemExit(1)
          value = json.load(sys.stdin if args[5] == "-" else open(args[5]))
          for part in args[1].split("."):
              value = value[int(part)] if part.isdigit() else value[part]
          if args[2] == "json":
              sys.stdout.write(json.dumps(value) + "\n")
          elif args[2] == "raw":
              sys.stdout.write((value if isinstance(value, str) else json.dumps(value)) + "\n")
          else:
              sys.stderr.write("unsupported plutil format\n")
              raise SystemExit(1)
          EOF
          chmod 755 "$shim/stat" "$shim/plutil"
          export PATH="${shim}:${PATH}"
          /bin/bash -n deploy/apple-container.sh
          /bin/bash deploy/tests/apple-container-test.sh
          /bin/sh deploy/tests/docker-compose-security-test.sh
          /bin/sh deploy/tests/docker-compose-gateway-env-test.sh
          /bin/sh deploy/tests/docker-runtime-resources-test.sh
          /bin/sh deploy/test-caddyfile-cache.sh

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check Docker Compose simple mode environment
        run: /bin/sh deploy/tests/docker-compose-simple-mode-env-test.sh
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: |
          go version | grep -q 'go1.27.4'
      - name: Unit tests
        working-directory: backend
        run: make test-unit
      - name: Integration tests
        working-directory: backend
        run: make test-integration

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Frontend typecheck and critical vitest
        run: make test-frontend

  golangci-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: |
          go version | grep -q 'go1.27.4'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          args: --timeout=30m
          working-directory: backend

  release-helpers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r .github/release-tools/requirements-release.txt
      - run: python -m unittest discover -s .github/release-tools -p 'test_release_matrix.py'
      - run: bash -n .github/release-tools/release-images.sh
