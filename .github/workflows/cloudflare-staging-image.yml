name: Cloudflare staging image

# Records the staging image. It does not deploy a Worker or touch production.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.record.outputs.digest }}
      repository: ${{ steps.record.outputs.repository }}
      sha: ${{ steps.record.outputs.sha }}
      run_id: ${{ steps.record.outputs.run_id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Build and push the staging image
        id: record
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4.160.1 containers build . -p -t needtoken-pool-staging:isolated
          registry="registry.cloudflare.com/${CLOUDFLARE_ACCOUNT_ID}/needtoken-pool-staging:isolated"
          ref="$(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$registry" | awk '/^registry\.cloudflare\.com\/[A-Za-z0-9-]+\/needtoken-pool-staging@sha256:[0-9a-f]{64}$/ { print; exit }')"
          if [ -z "$ref" ]; then
            echo "registry digest was not produced" >&2
            exit 1
          fi
          {
            echo "digest=${ref}"
            echo "repository=${GITHUB_REPOSITORY}"
            echo "sha=${GITHUB_SHA}"
            echo "run_id=${GITHUB_RUN_ID}"
          } >> "$GITHUB_OUTPUT"
      - name: Record the image identity
        run: |
          {
            echo '```json'
            echo '{'
            echo '  "source": "github-actions-build",'
            echo '  "recorded": true,'
            echo "  \"repository\": \"${{ steps.record.outputs.repository }}\","
            echo "  \"sha\": \"${{ steps.record.outputs.sha }}\","
            echo "  \"run_id\": \"${{ steps.record.outputs.run_id }}\","
            echo "  \"digest\": \"${{ steps.record.outputs.digest }}\""
            echo '}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
